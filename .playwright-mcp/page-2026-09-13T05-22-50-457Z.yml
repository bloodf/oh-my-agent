            - paragraph [ref=e228]: What the door guards
            - heading "Everything between your tools and your providers" [level=2] [ref=e229]
            - paragraph [ref=e230]: Credentials, routing, fallbacks, translation and the ledger of every call, all on hardware you control.
          - list [ref=e231]:
            - listitem [ref=e232]:
              - generic [ref=e233]:
                - generic [ref=e234]: "01"
                - heading "One local endpoint" [level=3] [ref=e239]
                - paragraph [ref=e240]: Configure tools once against http://localhost:20128/v1 instead of wiring each app to a different provider.
            - listitem [ref=e241]:
              - generic [ref=e242]:
                - generic [ref=e243]: "02"
                - heading "Reusable provider connections" [level=3] [ref=e248]
                - paragraph [ref=e249]: Add an OAuth login, API key, cookie, or compatible endpoint once. Every tool shares it.
            - listitem [ref=e250]:
              - generic [ref=e251]:
                - generic [ref=e252]: "03"
                - heading "Account & combo fallback" [level=3] [ref=e257]
                - paragraph [ref=e258]: Chain connections for resilience, or stack models behind one stable name that retries the next option.
            - listitem [ref=e259]:
              - generic [ref=e260]:
                - generic [ref=e261]: "04"
                - heading "Format translation" [level=3] [ref=e266]
                - paragraph [ref=e267]: Send OpenAI-shaped requests; DurinDoor speaks Claude, Gemini, Kiro, Cursor, Ollama, Vertex and more upstream.
            - listitem [ref=e268]:
              - generic [ref=e269]:
                - generic [ref=e270]: "05"
                - heading "Usage visibility" [level=3] [ref=e275]
                - paragraph [ref=e276]: Provider, model, tokens, cost estimate, latency and fallback outcome for every request.
            - listitem [ref=e277]:
              - generic [ref=e278]:
                - generic [ref=e279]: "06"
                - heading "Self-hosted state" [level=3] [ref=e284]
                - paragraph [ref=e285]: Storage, credentials and logs live in your DATA_DIR. You decide where it runs and who can reach it.
            - listitem [ref=e286]:
              - generic [ref=e287]:
                - generic [ref=e288]: "07"
                - heading "Token saver" [level=3] [ref=e293]
                - paragraph [ref=e294]: Opt-in prompt compression before upstream dispatch. Fail-open by design, so requests never break.
            - listitem [ref=e295]:
              - generic [ref=e296]:
                - generic [ref=e297]: "08"
                - heading "MCP gateway" [level=3] [ref=e302]
                - paragraph [ref=e303]: Expose multiple MCP servers behind managed keys and routes from the same dashboard.
            - listitem [ref=e304]:
              - generic [ref=e305]:
                - generic [ref=e306]: "09"
                - heading "Quota tracking" [level=3] [ref=e311]
                - paragraph [ref=e312]: Provider limits and reset windows side by side, so you know which account still has room.
            - listitem [ref=e313]:
