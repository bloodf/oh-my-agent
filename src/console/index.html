<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>oh-my-agent console</title>
		<link rel="stylesheet" href="/style.css" />
	</head>
	<body>
		<aside id="sidebar">
			<h1>Channels</h1>
			<ul id="channels"></ul>
		</aside>
		<main id="main">
			<header id="current-channel"></header>
			<div id="messages" aria-live="polite"></div>
			<div id="state" role="status" hidden>
				<p class="state-title"></p>
				<p class="state-detail"></p>
				<button class="state-action" type="button"></button>
			</div>
			<form id="composer">
				<textarea
					id="composer-input"
					rows="1"
					placeholder="Message the channel"
					autocomplete="off"
				></textarea>
				<button id="composer-send" type="submit">Send</button>
				<p class="composer-hint">
					<kbd>Enter</kbd> to send · <kbd>Shift</kbd>+<kbd>Enter</kbd> for a
					new line
				</p>
			</form>
		</main>
		<aside id="thread" hidden>
			<header>
				<span id="thread-title"></span>
				<button id="thread-close" type="button">Close</button>
			</header>
			<div id="thread-messages"></div>
			<form id="thread-composer">
				<textarea
					id="thread-composer-input"
					rows="1"
					placeholder="Reply in thread"
					autocomplete="off"
				></textarea>
				<button id="thread-composer-send" type="submit">Reply</button>
				<p class="composer-hint">
					<kbd>Enter</kbd> to send · <kbd>Shift</kbd>+<kbd>Enter</kbd> for a
					new line
				</p>
			</form>
		</aside>
		<script src="/app.js"></script>
	</body>
</html>
