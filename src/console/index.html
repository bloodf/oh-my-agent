<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>oh-my-agent console</title>
		<link rel="stylesheet" href="/style.css" />
	</head>
	<body>
		<a class="skip-link" href="#composer-input">Skip to composer</a>
		<nav id="sidebar" aria-label="Channels and agents">
			<h1>Channels</h1>
			<!-- biome-ignore lint/a11y/noNoninteractiveElementToInteractiveRole: app.js renders role="option" children with a roving tabindex; the listbox+option pattern is asserted by tests -->
			<ul id="channels" role="listbox" aria-label="Channels"></ul>
		</nav>
		<main id="main">
			<!-- biome-ignore lint/a11y/noInteractiveElementToNoninteractiveRole: explicit banner role is asserted by tests; header nested in main has no implicit banner semantics -->
			<header id="current-channel" role="banner"></header>
			<!-- biome-ignore-start lint/a11y/noNoninteractiveTabindex: the scrollable transcript must be keyboard-focusable (WCAG 2.1.1); keyboard scrolling is asserted by tests -->
			<div
				id="messages"
				role="log"
				aria-label="Channel transcript"
				aria-live="polite"
				tabindex="0"
			></div>
			<!-- biome-ignore-end lint/a11y/noNoninteractiveTabindex: transcript focusability -->

			<div id="state" role="status" hidden>
				<p class="state-title"></p>
				<p class="state-detail"></p>
				<button class="state-action" type="button"></button>
			</div>
			<form id="composer">
				<textarea
					id="composer-input"
					rows="1"
					aria-label="Message the channel"
					placeholder="Message the channel"
					autocomplete="off"
				></textarea>
				<button id="composer-send" type="submit">Send</button>
				<p class="composer-hint">
					<kbd>Enter</kbd> to send · <kbd>Shift</kbd>+<kbd>Enter</kbd> for a
					new line
				</p>
			</form>
		</main>
		<!-- biome-ignore lint/a11y/noRedundantRoles: tests assert the explicit complementary role; keeping it explicit guards the landmark against element changes -->
		<aside id="thread" role="complementary" aria-label="Thread" hidden>
			<header>
				<span id="thread-title"></span>
				<button id="thread-close" type="button" aria-label="Close thread">
					Close
				</button>
			</header>
			<div id="thread-messages"></div>
			<form id="thread-composer">
				<textarea
					id="thread-composer-input"
					rows="1"
					aria-label="Reply in thread"
					placeholder="Reply in thread"
					autocomplete="off"
				></textarea>
				<button id="thread-composer-send" type="submit">Reply</button>
				<p class="composer-hint">
					<kbd>Enter</kbd> to send · <kbd>Shift</kbd>+<kbd>Enter</kbd> for a
					new line
				</p>
			</form>
		</aside>
		<script src="/app.js"></script>
	</body>
</html>
