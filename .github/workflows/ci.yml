name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install headless Chrome for the console suite
        run: bunx @puppeteer/browsers install chrome-headless-shell --path "$HOME/.cache/puppeteer"

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Lint and format
        run: bunx biome check .

      - name: Delivery docs are current
        run: |
          python3 scripts/gen-delivery-docs.py
          git diff --exit-code docs/
