name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Versions match changelog
        run: |
          bun -e '
            const manifest = await Bun.file("package.json").json();
            const changelog = await Bun.file("CHANGELOG.md").text();
            const entry = changelog.match(/^## \[(?!Unreleased\])([^\]]+)\](?: - .+)?$/m);
            if (!entry) throw new Error("CHANGELOG.md has no released version entry");
            for (const [field, version] of [["package.json version", manifest.version], ["omp.version", manifest.omp?.version]]) {
              if (version !== entry[1]) throw new Error(`${field} ${version} does not match CHANGELOG.md ${entry[1]}`);
            }
          '

      - name: Patch hygiene
        run: python3 scripts/check-patches.py

      - name: Patch hygiene selftest
        run: python3 scripts/check-patches.py --selftest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install frontend dependencies
        run: bun install --cwd web --frozen-lockfile

      - name: Install headless Chrome for the console suite
        run: bunx @puppeteer/browsers install chrome-headless-shell --path "$HOME/.cache/puppeteer"

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        # The consumer-install smoke drives the real `omp` executable, which
        # ships as a bin of the pi-coding-agent dev dependency. Without it on
        # PATH that suite throws before it can assert anything, so the install
        # this workflow already performed is what makes the smoke runnable.
        run: PATH="$PWD/node_modules/.bin:$PATH" bun test --timeout 30000

      - name: Lint and format
        run: bunx biome check .

      - name: Delivery docs are current
        run: |
          python3 scripts/gen-delivery-docs.py
          git diff --exit-code docs/
