name: release

on:
  # Manual dispatch only, on both counts. This job runs the consumer-install
  # E2E smoke, and E2E workflows are manual-trigger only; publishing is also
  # irreversible, so a tag push must never be able to put a version on the
  # registry by itself. An operator names the tag and says, in the same
  # action, whether this run publishes it.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify (e.g. v1.2.3)"
        required: true
        type: string
      publish:
        description: "Publish the verified tarball to npm (unchecked = verify only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Tag matches package.json version and omp.version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          bun -e '
            const manifest = await Bun.file("package.json").json();
            if (manifest.version !== manifest.omp?.version) {
              throw new Error(`package.json version ${manifest.version} does not match omp.version ${manifest.omp?.version}`);
            }
            const expected = `v${manifest.version}`;
            if (process.env.RELEASE_TAG !== expected) {
              throw new Error(`release tag ${process.env.RELEASE_TAG} does not match package.json version ${expected}`);
            }
          '

      - name: Versions match changelog
        run: |
          bun -e '
            const manifest = await Bun.file("package.json").json();
            const changelog = await Bun.file("CHANGELOG.md").text();
            const entry = changelog.match(/^## \[(?!Unreleased\])([^\]]+)\](?: - .+)?$/m);
            if (!entry) throw new Error("CHANGELOG.md has no released version entry");
            for (const [field, version] of [["package.json version", manifest.version], ["omp.version", manifest.omp?.version]]) {
              if (version !== entry[1]) throw new Error(`${field} ${version} does not match CHANGELOG.md ${entry[1]}`);
            }
          '

      - name: Patch hygiene
        run: python3 scripts/check-patches.py

      - name: Patch hygiene selftest
        run: python3 scripts/check-patches.py --selftest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pack lifecycle (typecheck and fast suites)
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/oma-pack"
          npm pack --json --silent --pack-destination "$RUNNER_TEMP/oma-pack" | tee "$RUNNER_TEMP/oma-pack.log"
          bun -e '
            const stdout = await Bun.file(`${process.env.RUNNER_TEMP}/oma-pack.log`).text();
            // npm pack --json can be preceded by prepack lifecycle logs (typecheck/test
            // output, and even a bun test banner line), so scan backward for the last
            // "[" or "{" that starts valid JSON. npm <=11 prints an array of entries;
            // npm 12 prints an object keyed by package name, with "filename" nested one
            // level down inside that value rather than at the top level.
            let filename;
            for (let i = stdout.length - 1; i >= 0 && !filename; i--) {
              const ch = stdout[i];
              if (ch !== "[" && ch !== "{") continue;
              try {
                const parsed = JSON.parse(stdout.slice(i));
                let candidates;
                if (Array.isArray(parsed)) {
                  candidates = parsed;
                } else if (parsed && typeof parsed === "object" && typeof parsed.filename === "string") {
                  candidates = [parsed];
                } else if (parsed && typeof parsed === "object") {
                  candidates = Object.values(parsed);
                } else {
                  candidates = [];
                }
                const entry = candidates.find((c) => c && typeof c === "object" && typeof c.filename === "string");
                if (entry) filename = entry.filename;
              } catch {}
            }
            if (!filename) throw new Error(`npm pack JSON not found in stdout:\n${stdout}`);
            console.log(`OMA_PACKED_TARBALL=${process.env.RUNNER_TEMP}/oma-pack/${filename}`);
          ' >> "$GITHUB_ENV"

      - name: Install headless Chrome for the console suite
        run: bunx @puppeteer/browsers install chrome-headless-shell --path "$HOME/.cache/puppeteer"

      - name: Browser suite
        run: bun test --timeout 30000 tests/console-client.test.ts

      - name: Lint and format
        run: bunx biome check .

      - name: Delivery docs are current
        run: |
          python3 scripts/gen-delivery-docs.py
          git diff --exit-code docs/

      - name: Pack artifact assertions
        run: bun test --timeout 30000 tests/pack.test.ts

      - name: "Consumer-install smoke (RpcClient.pid contract: absent, degraded supervision)"
        # Same reason as ci.yml: this smoke drives the real `omp` executable,
        # which ships as a bin of the pi-coding-agent dev dependency installed
        # above. Without it on PATH the OMP-installer variant throws before it
        # can assert the pid contract, and that is the last gate before Publish.
        run: PATH="$PWD/node_modules/.bin:$PATH" bun run test:consumer-install

      - name: Upload verified tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: ${{ env.OMA_PACKED_TARBALL }}
          if-no-files-found: error

      - name: Release notes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          bun scripts/cut-changelog.ts notes --version "$VERSION" > "$RUNNER_TEMP/notes.md"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          body_path: ${{ runner.temp }}/notes.md
          files: ${{ env.OMA_PACKED_TARBALL }}
          draft: ${{ !inputs.publish }}
          make_latest: ${{ inputs.publish }}
          fail_on_unmatched_files: true

  publish:
    needs: release
    if: inputs.publish
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/oma-pack

      - name: Publish the verified tarball
        run: |
          set -euo pipefail
          TARBALL=$(ls "$RUNNER_TEMP/oma-pack"/*.tgz)
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          npm publish "$TARBALL" --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
